name: Contribution Snake

on:
  push:
    branches: [main]
    paths: [.github/workflows/contribution-snake.yml]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: fieai
          outputs: assets/contribution-snake.svg?palette=github-light&color_snake=%236d28d9
      - name: Commit the animation if it changed
        run: |
          test -s assets/contribution-snake.svg
          git add assets/contribution-snake.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh contribution snake'
          git push origin HEAD:main
